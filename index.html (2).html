<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escalera Infinita: La Aventura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Prevenir scroll en móviles */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Dejar pasar clicks al canvas donde no hay UI */
            display: flex;
            flex-direction: column;
        }

        /* Pantallas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        h1, h2 { font-family: 'Fredoka One', cursive; text-shadow: 2px 4px 0px rgba(0,0,0,0.5); }
        
        .btn {
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            border: 4px solid #1e3a8a;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 32px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e3a8a, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s;
            pointer-events: auto;
            text-transform: uppercase;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1e3a8a, 0 2px 5px rgba(0,0,0,0.5);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-family: 'Fredoka One', cursive;
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px #000;
        }

        /* Controles Móviles */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            display: none; /* Oculto por defecto en PC */
            justify-content: space-between;
            padding: 0 20px;
        }

        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .t-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        .t-btn:active { background: rgba(255, 255, 255, 0.5); }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            .btn { font-size: 1.2rem; padding: 10px 24px; }
            h1 { font-size: 2.5rem; text-align: center; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div>
                <span class="text-yellow-400">🪙</span> <span id="scoreDisplay">0</span>
            </div>
            <div>
                <span class="text-red-500">❤️</span> <span id="livesDisplay">3</span>
            </div>
            <div>
                <button id="pauseBtn" class="bg-white/20 border-2 border-white/50 rounded p-2 pointer-events-auto hover:bg-white/40 backdrop-blur-sm">⏸️</button>
            </div>
        </div>

        <!-- Controles Móviles -->
        <div id="mobile-controls">
            <div class="control-group items-end">
                <div class="t-btn" id="btnLeft">◀</div>
                <div class="t-btn" id="btnRight">▶</div>
            </div>
            <div class="control-group items-end">
                <div class="t-btn" id="btnDown">▼</div>
                <div class="t-btn" id="btnJump">▲</div>
            </div>
        </div>

        <!-- Pantalla Inicio -->
        <div id="startScreen" class="screen">
            <h1 class="text-5xl md:text-7xl text-white mb-2 tracking-wide">ESCALERA</h1>
            <h2 class="text-3xl md:text-5xl text-blue-400 mb-8">INFINITA</h2>
            <div class="bg-black/50 p-4 rounded-xl text-white text-center mb-8 max-w-md border border-gray-600">
                <p class="mb-2 font-bold text-xl">CÓMO JUGAR:</p>
                <p class="text-sm opacity-90">🖥️ PC: Flechas o WASD para moverte, ESPACIO para saltar.</p>
                <p class="text-sm opacity-90">📱 Móvil: Usa los botones en pantalla.</p>
                <p class="text-sm mt-2 text-yellow-300">¡Recoge monedas y no caigas al vacío!</p>
            </div>
            <button id="startBtn" class="btn">JUGAR AHORA</button>
        </div>

        <!-- Pantalla Pausa -->
        <div id="pauseScreen" class="screen hidden">
            <h1 class="text-5xl text-white mb-8">PAUSA</h1>
            <button id="resumeBtn" class="btn">CONTINUAR</button>
        </div>

        <!-- Pantalla Game Over -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 class="text-6xl text-red-500 mb-4">GAME OVER</h1>
            <p class="text-2xl text-white mb-2">Puntuación: <span id="finalScore" class="text-yellow-400">0</span></p>
            <p class="text-xl text-gray-300 mb-8">Récord: <span id="highScore" class="text-blue-400">0</span></p>
            <button id="restartBtn" class="btn">REINTENTAR</button>
        </div>
    </div>
</div>

<script>
/**
 * ESCALERA INFINITA 3D
 * Motor gráfico: Three.js
 */

// Elementos UI
const ui = {
    start: document.getElementById('startScreen'),
    pause: document.getElementById('pauseScreen'),
    over: document.getElementById('gameOverScreen'),
    hud: document.getElementById('hud'),
    score: document.getElementById('scoreDisplay'),
    lives: document.getElementById('livesDisplay'),
    finalScore: document.getElementById('finalScore'),
    highScore: document.getElementById('highScore')
};

// Sistema de Audio Sintetizado (Mantenido del original)
const AudioSys = {
    ctx: null,
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    playTone(freq, type, duration, vol=0.1, slideFreq=null) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    jump() { this.playTone(300, 'square', 0.2, 0.05, 600); },
    coin() { this.playTone(800, 'sine', 0.1, 0.1, 1200); },
    hit() { this.playTone(150, 'sawtooth', 0.3, 0.1, 50); },
    dead() { this.playTone(100, 'square', 0.8, 0.1, 20); }
};

// Input
const keys = { left: false, right: false, up: false, down: false };
window.addEventListener('keydown', e => setKey(e, true));
window.addEventListener('keyup', e => setKey(e, false));
function setKey(e, isDown) {
    if(GAME.state !== 'PLAYING') {
        if(e.code === 'Escape' && isDown && GAME.state === 'PAUSED') pauseGame();
        return;
    }
    if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = isDown;
    if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = isDown;
    if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = isDown;
    if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = isDown;
    if(e.code === 'Escape' && isDown) pauseGame();
}

const bindTouch = (id, keyName) => {
    const btn = document.getElementById(id);
    if(btn) {
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[keyName] = false; });
    }
};
bindTouch('btnLeft', 'left');
bindTouch('btnRight', 'right');
bindTouch('btnJump', 'up');
bindTouch('btnDown', 'down');

// --- SETUP THREE.JS ---
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a); // Fondo noche
scene.fog = new THREE.Fog(0x0f172a, 15, 60); // Niebla para ocultar generación

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Luces
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

// --- ENTIDADES DEL JUEGO ---
const GAME = {
    state: 'START',
    score: 0,
    highScore: localStorage.getItem('escaleraHighScore3D') || 0,
    lives: 3,
    speedMultiplier: 1,
    clock: new THREE.Clock()
};

let platforms = [];
let coins = [];
let obstacles = [];
let particles = [];
let nextPlatformZ = 0;
let currentPlatformY = 0;
let playerGroup, playerBody;
let pV = new THREE.Vector3(); // Velocidad del jugador
let isGrounded = false;
let invulnerableTimer = 0;
let cameraShake = 0;

// Crear Jugador
function createPlayer() {
    if(playerGroup) scene.remove(playerGroup);
    playerGroup = new THREE.Group();
    
    // Cuerpo
    const bodyGeo = new THREE.BoxGeometry(1, 1.5, 1);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, metalness: 0.2 });
    playerBody = new THREE.Mesh(bodyGeo, bodyMat);
    playerBody.position.y = 0.75;
    playerBody.castShadow = true;
    playerGroup.add(playerBody);
    
    // Ojos (Visor)
    const visorGeo = new THREE.BoxGeometry(0.8, 0.3, 0.1);
    const visorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 1.1, -0.51); // Hacia -Z
    playerGroup.add(visor);
    
    const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.05);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.2, 1.1, -0.55);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.2, 1.1, -0.55);
    playerGroup.add(eyeL, eyeR);

    scene.add(playerGroup);
}

// Generación Procedural
const colors = [0x6366f1, 0x8b5cf6, 0xec4899, 0x14b8a6, 0x3b82f6];

function spawnPlatform() {
    const width = 4 + Math.random() * 6;
    const depth = 5 + Math.random() * 10;
    
    // Altura: sube o baja
    if (nextPlatformZ < 0) {
        const yStep = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 0.5);
        currentPlatformY += yStep;
        if(currentPlatformY > 5) currentPlatformY = 3;
        if(currentPlatformY < -5) currentPlatformY = -3;
    }

    const geometry = new THREE.BoxGeometry(width, 2, depth);
    const mat = new THREE.MeshStandardMaterial({ 
        color: colors[Math.floor(Math.random() * colors.length)],
        roughness: 0.1
    });

    const mesh = new THREE.Mesh(geometry, mat);
    mesh.position.set((Math.random() - 0.5) * 2, currentPlatformY - 1, nextPlatformZ - depth / 2);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    scene.add(mesh);
    
    // Bounding Box para colisiones precisas
    mesh.geometry.computeBoundingBox();

    platforms.push({ mesh, width, depth, y: currentPlatformY });

    // Spawn Monedas
    if(Math.random() > 0.4 && nextPlatformZ < -10) {
        const cGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const cMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.8, roughness: 0.2 });
        const coin = new THREE.Mesh(cGeo, cMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(mesh.position.x + (Math.random()-0.5)*(width-1), currentPlatformY + 1, mesh.position.z);
        coin.castShadow = true;
        scene.add(coin);
        coins.push(coin);
    }

    // Spawn Obstáculos
    if(Math.random() > 0.6 && nextPlatformZ < -20) {
        const isSpike = Math.random() > 0.5;
        let obs;
        if(isSpike) {
            const oGeo = new THREE.ConeGeometry(0.5, 1.5, 4);
            const oMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.5 });
            obs = new THREE.Mesh(oGeo, oMat);
            obs.position.set(mesh.position.x, currentPlatformY + 0.75, mesh.position.z);
        } else {
            const oGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const oMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            obs = new THREE.Mesh(oGeo, oMat);
            obs.position.set(mesh.position.x + (Math.random()-0.5)*2, currentPlatformY + 0.75, mesh.position.z);
        }
        obs.castShadow = true;
        scene.add(obs);
        obs.geometry.computeBoundingBox();
        obstacles.push(obs);
    }

    nextPlatformZ -= depth + (Math.random() * 2 + 1); // Brecha
}

function spawnParticles(pos, color, count) {
    for(let i=0; i<count; i++) {
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos);
        p.velocity = new THREE.Vector3((Math.random()-0.5)*15, Math.random()*15, (Math.random()-0.5)*15);
        p.life = 1.0;
        scene.add(p);
        particles.push(p);
    }
}

function takeDamage() {
    if(invulnerableTimer > 0) return;
    GAME.lives--;
    ui.lives.innerText = GAME.lives;
    AudioSys.hit();
    cameraShake = 0.3;
    
    if(GAME.lives <= 0) {
        gameOver();
    } else {
        invulnerableTimer = 2.0;
        pV.y = 15; // Rebote
    }
}

function gameOver() {
    GAME.state = 'GAMEOVER';
    AudioSys.dead();
    ui.hud.classList.add('hidden');
    ui.over.classList.remove('hidden');
    ui.finalScore.innerText = GAME.score;
    if(GAME.score > GAME.highScore) {
        GAME.highScore = GAME.score;
        localStorage.setItem('escaleraHighScore3D', GAME.highScore);
    }
    ui.highScore.innerText = GAME.highScore;
}

// --- LOGICA PRINCIPAL ---
function updatePhysics(dt) {
    // Gravedad
    pV.y -= 45 * dt;
    if(keys.down && !isGrounded) pV.y -= 50 * dt; // Caída rápida

    // Movimiento Lateral
    const moveSpeedX = 12;
    let targetVX = 0;
    if(keys.left) targetVX = -moveSpeedX;
    if(keys.right) targetVX = moveSpeedX;
    pV.x = THREE.MathUtils.lerp(pV.x, targetVX, 10 * dt);

    // Movimiento Frontal (Automático)
    pV.z = -12 * GAME.speedMultiplier;

    // Aplicar Velocidad
    playerGroup.position.x += pV.x * dt;
    playerGroup.position.y += pV.y * dt;
    playerGroup.position.z += pV.z * dt;
    
    // Inclinación visual del jugador al moverse lateralmente
    playerGroup.rotation.z = THREE.MathUtils.lerp(playerGroup.rotation.z, pV.x * -0.05, 10 * dt);

    // Detección de suelo (AABB contra superficie superior de plataformas)
    isGrounded = false;
    let platformUnder = null;
    
    // Simplificación de colisión de piso para el runner
    for(let p of platforms) {
        const box = p.mesh;
        const minX = box.position.x - p.width/2;
        const maxX = box.position.x + p.width/2;
        const minZ = box.position.z - p.depth/2;
        const maxZ = box.position.z + p.depth/2;
        
        // Tolerancia de borde
        if(playerGroup.position.x > minX - 0.5 && playerGroup.position.x < maxX + 0.5 &&
           playerGroup.position.z > minZ && playerGroup.position.z < maxZ + 1) { // +1 por si salta tarde
            platformUnder = p;
            break;
        }
    }

    if (platformUnder) {
        const floorY = platformUnder.y;
        if (playerGroup.position.y <= floorY && pV.y <= 0) {
            playerGroup.position.y = floorY;
            pV.y = 0;
            isGrounded = true;
            
            // Salto
            if(keys.up) {
                pV.y = 20;
                isGrounded = false;
                AudioSys.jump();
                spawnParticles(new THREE.Vector3(playerGroup.position.x, floorY, playerGroup.position.z), 0xffffff, 5);
                keys.up = false; // Requiere presionar de nuevo
            }
        }
    }

    // Caída al abismo
    if(playerGroup.position.y < currentPlatformY - 15) {
        takeDamage();
        if(GAME.lives > 0 && platformUnder) {
             playerGroup.position.set(platformUnder.mesh.position.x, platformUnder.y + 5, platformUnder.mesh.position.z);
             pV.set(0,0,0);
        }
    }

    // Colisiones: Bounding Box simple para objetos
    const pBox = new THREE.Box3().setFromObject(playerGroup);
    pBox.expandByScalar(-0.2); // Más permisivo

    // Monedas
    for(let i = coins.length-1; i>=0; i--) {
        const c = coins[i];
        c.rotation.y += 5 * dt;
        c.rotation.z += 2 * dt;
        const cBox = new THREE.Box3().setFromObject(c);
        if(pBox.intersectsBox(cBox)) {
            GAME.score += 10;
            ui.score.innerText = GAME.score;
            AudioSys.coin();
            spawnParticles(c.position, 0xfbbf24, 8);
            scene.remove(c);
            coins.splice(i, 1);
            if(GAME.score % 100 === 0) GAME.speedMultiplier += 0.1;
        }
    }

    // Obstáculos
    if (invulnerableTimer <= 0) {
        for(let o of obstacles) {
            const oBox = new THREE.Box3().setFromObject(o);
            oBox.expandByScalar(-0.2);
            if(pBox.intersectsBox(oBox)) {
                takeDamage();
                break;
            }
        }
    } else {
        invulnerableTimer -= dt;
        playerGroup.visible = Math.floor(invulnerableTimer * 10) % 2 === 0;
    }
    if(invulnerableTimer <= 0) playerGroup.visible = true;

    // Partículas
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.position.addScaledVector(p.velocity, dt);
        p.velocity.y -= 30 * dt; 
        p.life -= dt * 2;
        p.scale.setScalar(Math.max(0, p.life));
        if(p.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }

    // Generar terreno infinito
    while(nextPlatformZ > playerGroup.position.z - 60) {
        spawnPlatform();
    }
    
    // Limpiar terreno viejo
    for(let i = platforms.length - 1; i >= 0; i--) {
        if(platforms[i].mesh.position.z > playerGroup.position.z + 10) {
            scene.remove(platforms[i].mesh);
            platforms.splice(i, 1);
        }
    }
    for(let i = obstacles.length - 1; i >= 0; i--) {
        if(obstacles[i].position.z > playerGroup.position.z + 10) {
            scene.remove(obstacles[i]);
            obstacles.splice(i, 1);
        }
    }
    for(let i = coins.length - 1; i >= 0; i--) {
        if(coins[i].position.z > playerGroup.position.z + 10) {
            scene.remove(coins[i]);
            coins.splice(i, 1);
        }
    }

    // Aumentar puntuación por distancia
    const distScore = Math.floor(-playerGroup.position.z / 10);
    if(distScore > GAME.score) {
        GAME.score = distScore;
        ui.score.innerText = GAME.score;
    }

    // Cámara sigue al jugador
    const targetCam = new THREE.Vector3(
        playerGroup.position.x * 0.3,
        playerGroup.position.y + 4,
        playerGroup.position.z + 8
    );
    camera.position.lerp(targetCam, 5 * dt);
    
    let lookTarget = new THREE.Vector3(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z - 10);
    if(cameraShake > 0) {
        cameraShake -= dt;
        let shake = cameraShake * 2;
        camera.position.add(new THREE.Vector3((Math.random()-0.5)*shake, (Math.random()-0.5)*shake, 0));
    }
    camera.lookAt(lookTarget);
    
    // Actualizar Luz principal para que siga al jugador
    dirLight.position.set(playerGroup.position.x + 10, playerGroup.position.y + 20, playerGroup.position.z + 10);
    dirLight.target.position.copy(playerGroup.position);
    dirLight.target.updateMatrixWorld();
}

function render() {
    requestAnimationFrame(render);
    const dt = Math.min(GAME.clock.getDelta(), 0.1);

    if (GAME.state === 'PLAYING') {
        updatePhysics(dt);
    } else if (GAME.state === 'START') {
        // Rotar cámara en inicio
        camera.position.set(Math.sin(Date.now()*0.001)*10, 5, Math.cos(Date.now()*0.001)*10);
        camera.lookAt(0,0,0);
    }
    
    renderer.render(scene, camera);
}

// --- CONTROLES DE ESTADO ---
function resetGame() {
    // Limpiar escena
    platforms.forEach(p => scene.remove(p.mesh));
    coins.forEach(c => scene.remove(c));
    obstacles.forEach(o => scene.remove(o));
    platforms = [];
    coins = [];
    obstacles = [];
    
    GAME.score = 0;
    GAME.lives = 3;
    GAME.speedMultiplier = 1;
    ui.score.innerText = '0';
    ui.lives.innerText = '3';
    
    nextPlatformZ = 5;
    currentPlatformY = 0;
    
    createPlayer();
    playerGroup.position.set(0, 5, 0);
    pV.set(0,0,0);
    
    // Plataforma segura inicial
    const geometry = new THREE.BoxGeometry(6, 2, 10);
    const mat = new THREE.MeshStandardMaterial({ color: 0x6366f1 });
    const startMesh = new THREE.Mesh(geometry, mat);
    startMesh.position.set(0, -1, 0);
    startMesh.receiveShadow = true;
    scene.add(startMesh);
    startMesh.geometry.computeBoundingBox();
    platforms.push({ mesh: startMesh, width: 6, depth: 10, y: 0 });
    
    nextPlatformZ = -8;
    for(let i=0; i<10; i++) spawnPlatform();
}

function startGame() {
    AudioSys.init();
    ui.start.classList.add('hidden');
    ui.over.classList.add('hidden');
    ui.pause.classList.add('hidden');
    ui.hud.classList.remove('hidden');
    resetGame();
    GAME.state = 'PLAYING';
    GAME.clock.start();
}

function pauseGame() {
    if(GAME.state === 'PLAYING') {
        GAME.state = 'PAUSED';
        ui.pause.classList.remove('hidden');
    } else if(GAME.state === 'PAUSED') {
        GAME.state = 'PLAYING';
        ui.pause.classList.add('hidden');
        GAME.clock.getDelta(); // reset delta to prevent huge jumps
    }
}

// Eventos UI
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.getElementById('resumeBtn').addEventListener('click', pauseGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Iniciar Loop
resetGame();
render();
</script>
</body>
</html>
